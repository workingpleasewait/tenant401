name: Analytics monitor

on:
  schedule:
    - cron: '0 * * * *'   # every hour on the hour
  workflow_dispatch: {}    # manual trigger for testing

jobs:
  monitor:
    name: Check PostHog event flow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Restore state from previous run to track consecutive failures
      - name: Restore monitor state
        uses: actions/cache@v4
        with:
          path: /tmp/monitor-state.json
          key: posthog-monitor-state
          restore-keys: posthog-monitor-state

      - name: Run PostHog monitor
        env:
          POSTHOG_PERSONAL_KEY: ${{ secrets.POSTHOG_PERSONAL_KEY }}
          STATE_FILE: /tmp/monitor-state.json
        run: python3 scripts/posthog-monitor.py

      # Always save updated state even if monitor exits 1
      - name: Save monitor state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/monitor-state.json
          key: posthog-monitor-state
